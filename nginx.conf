server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Security & Performance Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Hashed JS/CSS Assets (immutable) - Cache for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static Chapter JSON Chunks - Cache for 7 days
    location /data/chapters/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
    }

    # Static images and webp/fonts
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Sitemaps & robots.txt
    location ~* (sitemap.*\.xml|sitemap\.xsl|robots\.txt|llms\.txt)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Every page is prerendered to <route>/index.html (scripts/prerender.mjs),
    # so there is no SPA fallback: unknown URLs get a real HTTP 404 with dist/404.html.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    # Chapter data: a missing chapter JSON must be a 404, never an HTML page.
    location /data/ {
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # Prevent caching the root index.html so updates are immediate
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
